name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cinematch
          POSTGRES_PASSWORD: cinematch
          POSTGRES_DB: cinematch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cinematch"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CINEMATCH_TEST_DATABASE_URL: postgresql+psycopg://cinematch:cinematch@localhost:5432/cinematch_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - run: uv sync --frozen --extra ml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cinematch-api:ci .
