name: cinematch

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: cinematch-api:local
    env_file: .env
    environment:
      # Dentro da rede do compose o host do banco é "postgres", porta 5432.
      CINEMATCH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8010}:8000"
    volumes:
      - bronze:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Frontend (React/Vite) servido pelo nginx; /api -> serviço `api`.
    build: ./frontend/cinematch
    image: cinematch-web:local
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped

  mlflow:
    # Tracking server exclusivo do CineMatch (separado de outros projetos da máquina).
    # Metadados em SQLite e artefatos no volume `mlflow`; servidor faz proxy dos artefatos
    # (clientes não precisam de acesso ao filesystem). Só localhost.
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      - --workers=1
      - --allowed-hosts=localhost:${MLFLOW_HOST_PORT:-5010},127.0.0.1:${MLFLOW_HOST_PORT:-5010},mlflow:5000
    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT:-5010}:5000"
    volumes:
      - mlflow:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  bronze:
  mlflow:
